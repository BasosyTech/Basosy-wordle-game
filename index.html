    <header>Guess The Word</header>
    <main class="container">
      <section class="start-screen">
        <h1 class="start-screen__title">Guess The Word</h1>
        <p class="start-screen__description">
          Guess the hidden word in limited tries. Mindful, tactile color clues
          will guide your way.
        </p>
        <div class="start-screen__preview" aria-hidden="true">
          <span class="start-screen__tile">S</span>
          <span class="start-screen__tile">E</span>
          <span class="start-screen__tile">R</span>
          <span class="start-screen__tile">E</span>
          <span class="start-screen__tile">N</span>
          <span class="start-screen__tile">E</span>
        </div>
        <div class="legend legend--start-screen">
          <span class="legend__badge legend__badge--correct">Right Place</span>
          <span class="legend__badge legend__badge--present">Wrong Place</span>
          <span class="legend__badge legend__badge--absent">Not In Word</span>
        </div>
        <button type="button" class="start-screen__btn" id="start-game-btn">
          Start The Game
        </button>
      </section>
      <section class="game-screen" aria-label="Game Board" hidden>
        <div class="game-screen__info" role="status" aria-live="polite">
          <p class="game-screen__attempt-box">
            Attempt <output class="game-screen__current-attempt"></output> of
            <span class="game-screen__max-attempts"></span>
          </p>
          <p class="game-screen__hint-label">
            <svg class="hint-icon" aria-hidden="true" focusable="false">
              <use href="#icon-hint" />
            </svg>
            <output class="game-screen__hint-count"></output> Hints Left
          </p>
        </div>
        <section
          class="tries-container"
          role="grid"
          aria-label="Wordle Guess Grid"
        >
          <div class="tries-container__rows"></div>
          <div class="legend legend--tries-container">
            <span class="legend__badge legend__badge--correct"
              >Right Place</span
            >
            <span class="legend__badge legend__badge--present"
              >Wrong Place</span
            >
            <span class="legend__badge legend__badge--absent">Not In Word</span>
          </div>
        </section>
        <div class="game-screen__actions">
          <button class="game-screen__btn game-screen__btn--hint">
            <svg class="hint-icon" aria-hidden="true" focusable="false">
              <use href="#icon-hint" />
            </svg>
            Use Hint (<output class="game-screen__hint-count"></output> Left)
          </button>
          <button class="game-screen__btn game-screen__btn--check">
            Check Word
            <svg class="check-icon"><use href="#icon-check" /></svg>
          </button>
        </div>
        <section class="keyboard">
          <div class="keyboard__row keyboard__row--first">
            <button class="keyboard__key" data-key="Q">Q</button>
            <button class="keyboard__key" data-key="W">W</button>
            <button class="keyboard__key" data-key="E">E</button>
            <button class="keyboard__key" data-key="R">R</button>
            <button class="keyboard__key" data-key="T">T</button>
            <button class="keyboard__key" data-key="Y">Y</button>
            <button class="keyboard__key" data-key="U">U</button>
            <button class="keyboard__key" data-key="I">I</button>
            <button class="keyboard__key" data-key="O">O</button>
            <button class="keyboard__key" data-key="P">P</button>
          </div>
          <div class="keyboard__row keyboard__row--second">
            <button class="keyboard__key" data-key="A">A</button>
            <button class="keyboard__key" data-key="S">S</button>
            <button class="keyboard__key" data-key="D">D</button>
            <button class="keyboard__key" data-key="F">F</button>
            <button class="keyboard__key" data-key="G">G</button>
            <button class="keyboard__key" data-key="H">H</button>
            <button class="keyboard__key" data-key="J">J</button>
            <button class="keyboard__key" data-key="K">K</button>
            <button class="keyboard__key" data-key="L">L</button>
            <button
              class="keyboard__key keyboard__key--enter"
              data-key="Enter"
              aria-label="Submit guess"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                version="1.0"
                viewBox="0 0 512.000000 512.000000"
                preserveAspectRatio="xMidYMid meet"
              >
                <g
                  transform="translate(0.000000,512.000000) scale(0.100000,-0.100000)"
                  fill="#000000"
                  stroke="none"
                >
                  <path
                    d="M4186 3825 c-21 -7 -54 -28 -73 -46 -58 -57 -63 -91 -63 -463 -1 -463 -9 -508 -112 -621 -70 -77 -146 -112 -268 -125 -56 -6 -546 -10 -1200 -10 l-1104 0 266 268 c275 276 288 293 288 372 0 76 -55 159 -124 191 -50 23 -124 24 -174 4 -53 -22 -934 -904 -962 -962 -25 -53 -25 -116 -1 -168 13 -27 171 -192 482 -501 504 -501 493 -492 592 -481 125 15 215 154 177 273 -10 30 -72 99 -278 307 l-267 267 1040 0 c1091 0 1322 7 1462 40 154 36 318 142 419 268 59 74 128 217 153 314 30 117 41 280 41 618 0 300 -1 306 -24 356 -45 97 -158 139 -270 99z"
                  />
                </g>
              </svg>
            </button>
          </div>
          <div class="keyboard__row keyboard__row--third">
            <button class="keyboard__key" data-key="Z">Z</button>
            <button class="keyboard__key" data-key="X">X</button>
            <button class="keyboard__key" data-key="C">C</button>
            <button class="keyboard__key" data-key="V">V</button>
            <button class="keyboard__key" data-key="B">B</button>
            <button class="keyboard__key" data-key="N">N</button>
            <button class="keyboard__key" data-key="M">M</button>
            <button
              class="keyboard__key keyboard__key--backspace"
              data-key="Backspace"
              aria-label="Delete letter"
            >

              >

                  fill="#000000"
                />
              </svg>
            </button>
          </div>
        </section>
        <div class="game-screen__toasts"></div>
      </section>
      <dialog
        class="result-modal"
        id="result-modal"
        aria-labelledby="result-modal__title"
      >
        <svg class="result-modal__svg result-modal__svg--win" hidden>
          <use href="#icon-win"></use>
        </svg>
        <svg class="result-modal__svg result-modal__svg--lose" hidden>
          <use href="#icon-lose"></use>
        </svg>
        <h2 class="result-modal__title" id="result-modal__title"></h2>
        <p class="result-modal__description"></p>
        <p class="result-modal__word-label"></p>
        <div class="result-modal__word-letters"></div>
        <div class="result-modal__stats">
          <div class="result-modal__box result-modal__box--hint">
            <div class="result-modal__icon-wrap result-modal__icon-wrap--hint">
              <svg class="hint-icon" aria-hidden="true" focusable="false">
                <use href="#icon-hint" />
              </svg>
            </div>
            <div class="result-modal__box-info">
              <span
                class="result-modal__value result-modal__value--hint"
              ></span>
              <span class="result-modal__label">Hint Used</span>
            </div>
          </div>
          <div class="result-modal__box result-modal__box--streak">
            <div
              class="result-modal__icon-wrap result-modal__icon-wrap--streak"
            >
              <svg class="streak-icon"><use href="#icon-streak"></use></svg>
            </div>
            <div class="result-modal__box-info">
              <span
                class="result-modal__value result-modal__value--streak"
              ></span>
              <span class="result-modal__label">Streak</span>
            </div>
          </div>
          <div class="result-modal__box result-modal__box--score" hidden>
            <div class="result-modal__icon-wrap result-modal__icon-wrap--score">
              <svg class="score-icon"><use href="#icon-score"></use></svg>
            </div>
            <div class="result-modal__box-info">
              <span
                class="result-modal__value result-modal__value--score"
              ></span>
              <span class="result-modal__label">Score</span>
            </div>
          </div>
          <div class="result-modal__box result-modal__box--timer" hidden>
            <div class="result-modal__icon-wrap result-modal__icon-wrap--timer">
              <svg class="time-icon"><use href="#icon-time"></use></svg>
            </div>
            <div class="result-modal__box-info">
              <span
                class="result-modal__value result-modal__value--timer"
              ></span>
              <span class="result-modal__label">Time</span>
            </div>
          </div>
        </div>
        <button class="result-modal__btn">
          <svg class="again-icon"><use href="#icon-again"></use></svg>
          Try Again
        </button>
      </dialog>
    </main>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
